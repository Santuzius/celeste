[package]
name = "celeste"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
authors = [
    "Hunter Wittenborn <hunter@hunterwittenborn.com>",
    "Alexander Menzel <menzel.alexander@proton.me>",
]
repository = "https://github.com/Santuzius/celeste"

# The Go archive crate shares the app's version and lock file.
[workspace]
members = ["src/go"]

[workspace.package]
version = "0.22.0"

# cdylib for Android (loaded by IcedActivity), rlib for the desktop binary in src/main.rs.
[lib]
name = "celeste"
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
futures = "0.3.32"
# iced from the fork that runs it on Android (branch `android-0.14`, see github.com/Santuzius/iced_android). `x11` only satisfies iced's check that Unix targets pick a display server; nothing of it is built for Android. The desktop-only features are added below.
iced = { git = "https://github.com/Santuzius/iced", branch = "android-0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "tokio", "lazy", "svg", "x11"] }
# Soft keyboard, insets, back gesture and fonts on Android; does nothing on desktop.
iced_android = { git = "https://github.com/Santuzius/iced_android", features = ["emoji"] }
# Status-icon SVGs for the per-sync-dir cards and the system-tray
# pixmaps. Only the icon packs we actually pull from are enabled so
# we don't compile the rest of the icondata corpus.
icondata = { version = "0.7", default-features = false, features = ["tabler-icons", "material-design-icons"] }
# Direct handle on the `IconData` struct so we can stitch a Tabler
# cloud body together with refresh-arrow tips into a custom static —
# the facade re-exports the `Icon` alias but not the underlying
# struct. Already a transitive dep of `icondata`, so this adds nothing
# new to the build.
icondata_core = "0.1"
libc = "0.2"
# Rasterise tray SVGs to ARGB32 at startup so KDE's symbolic-icon
# recolour pipeline never touches them — it collapses the
# Inkscape-era masked paths to a solid black square.
resvg = { version = "0.47", default-features = false }
# Celeste's combined Go archive — provides the librclone RPC surface
# plus the native ProtonDrive entry points. See `src/go/` for the Go
# side.
celeste-go = { path = "src/go" }
sea-orm = { version = "0.10.7", features = ["sqlx-sqlite", "runtime-async-std-rustls", "macros"] }
# Without the default `cli` feature: Celeste runs its migrations itself and never needs the command-line tool.
sea-orm-migration = { version = "0.10.7", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# SHA-1 of local files, compared with the digest Proton and Google Drive keep per file to spot identical copies; already a transitive dependency.
sha1 = "0.10.6"
time = { version = "0.3.47", features = ["serde-well-known"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "sync"] }
# Without a translator tr! returns the English text; the gettext backend would link a C library that does not build for Android.
tr = { version = "0.1.11", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
# XDG desktop portal (folder chooser). Already pulled in by the keyring
# backend, so this adds nothing to the build.
dbus = "0.9"
# OS keyring (libsecret / Secret-Service) for the Proton session blobs
# and the rclone config file. Sync API + pure-Rust crypto so we don't
# pull zbus/tokio or OpenSSL into the dependency graph.
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
ksni = "0.3.4"
notify-rust = "4"
iced = { git = "https://github.com/Santuzius/iced", branch = "android-0.14", default-features = false, features = ["wayland", "linux-theme-detection", "thread-pool"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"
log = "0.4"

# Lets android_main outlive a destroyed activity, so the sync engine keeps running while Android has closed Celeste's window (branch `process-lifetime-0.6` on top of 0.6.1).
[patch.crates-io]
android-activity = { git = "https://github.com/Santuzius/android-activity", branch = "process-lifetime-0.6" }
