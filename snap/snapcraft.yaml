name: syncative
title: Syncative
summary: Sync local folders with Google Drive and Proton Drive
description: |
  Syncative keeps local folders in sync with Google Drive and Proton Drive, in both directions.

  - Several folders per account, each mapped to its own place in the cloud, with exclusions for sub-folders or files.
  - Files changed on both sides are not overwritten silently: Syncative asks which version to keep, or keeps both.
  - Proton Drive runs through Syncative's own end-to-end encrypted client; Google Drive through rclone's Drive backend.
  - Sign-in data stays in the desktop keyring (Secret Service).
  - Runs in the system tray and syncs on a schedule.

  This is a third-party application not officially supported by Google or Proton.
license: GPL-3.0-or-later
website: https://github.com/Santuzius/syncative
source-code: https://github.com/Santuzius/syncative
issues: https://github.com/Santuzius/syncative/issues
icon: assets/syncative-icon.svg
base: core24
grade: stable
confinement: strict
adopt-info: syncative

platforms:
  amd64:
  arm64:

apps:
  syncative:
    command: usr/bin/syncative
    desktop: usr/share/applications/syncative.desktop
    # The entry Syncative writes to $XDG_CONFIG_HOME/autostart (on by default, Preferences switches it); snapd starts the app from it at login.
    autostart: syncative.desktop
    # Wayland, X11, OpenGL/Vulkan through the GPU interface, portals (folder chooser, colour scheme), notifications and the GNOME runtime libraries.
    extensions: [gnome]
    plugs:
      # Sync folders anywhere under the real home directory (except hidden ones) and on removable drives.
      - home
      - removable-media
      - network
      # Local callback port of the Google sign-in (rclone's authorize flow, built in).
      - network-bind
      # Sign-in tokens live in the Secret Service keyring. Not auto-connected for new snaps; see doc/snap.md.
      - password-manager-service
      # Tray icon (StatusNotifierItem) on desktops whose tray relies on the legacy rules.
      - unity7

parts:
  syncative:
    plugin: rust
    source: .
    rust-channel: stable
    build-snaps:
      # Builds the librclone + Proton Drive archive (src/go); go.mod asks for 1.26.
      - go/1.26/stable
    build-packages:
      - git
      - pkg-config
      - libclang-dev # bindgen for the Go archive's C header
      - libdbus-1-dev # keyring → libdbus-sys
    build-environment:
      # Some dependencies use unstable rustc features behind RUSTC_BOOTSTRAP, as in the Nix build.
      - RUSTC_BOOTSTRAP: "1"
    stage-packages:
      - fontconfig # fc-match, which locates the UI font
      - libdbus-1-3
      - libvulkan1
    override-pull: |
      craftctl default
      # src/go/proton-api is a git submodule; a fresh clone (e.g. remote builds) doesn't have it yet.
      if [ ! -e src/go/proton-api/go.mod ]; then
        git submodule update --init --depth 1 src/go/proton-api
      fi
      craftctl set version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
    override-build: |
      craftctl default
      # The rust plugin installs to bin/; the desktop file expects usr/bin like other packages.
      install -Dm755 "$CRAFT_PART_INSTALL/bin/syncative" "$CRAFT_PART_INSTALL/usr/bin/syncative"
      rm -rf "$CRAFT_PART_INSTALL/bin"
      install -Dm644 assets/syncative-icon.svg "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/syncative-icon.svg"
      install -Dm644 snap/local/syncative.desktop "$CRAFT_PART_INSTALL/usr/share/applications/syncative.desktop"
    prime:
      - -usr/share/doc
      - -usr/share/man

lint:
  ignore:
    # wgpu loads the Vulkan loader at runtime (dlopen through ash), which the library linter can't see.
    - library:
        - usr/lib/*/libvulkan.so*
