[package]
name = "celeste-go"
version.workspace = true
edition = "2024"
license = "GPL-3.0-or-later"
description = "Celeste's combined Go archive: rclone librclone RPC + native ProtonDrive (go-proton-api) shims."
publish = false
build = "build.rs"
# Go sources + submodules live next to this manifest; exclude .git/.github
# from package if we ever decide to publish.
include = [
    "Cargo.toml",
    "build.rs",
    "src/**",
    "go.mod",
    "go.sum",
    "wrapper.go",
]

[lib]
name = "celeste_go"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
bindgen = "0.71"
